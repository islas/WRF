name: Regression Suite
# run-name : Run ${{ inputs.event_name == 'push' && 'CI' || inputs.event_label }} (${{ inputs.event_name }})
run-name : Run ${{ github.event_name == 'push' && 'CI' || github.event.label.name }} (${{ github.event_name }})

on:
# on:
#   push:
#     branches: [ master, develop ]
# # See https://stackoverflow.com/a/78444521 and 
# # https://github.com/orgs/community/discussions/26874#discussioncomment-3253755
# # as well as official (but buried) documentation :
# # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull-request-events-for-forked-repositories-2
  pull_request:
    types:    [ labeled ]

  workflow_dispatch:
    inputs:
      ref:
        description: Actual ref to use
        required: false
        default: null
        type: string
      sha:
        description: Actual sha to use
        required: false
        default: null
        type: string
      event_name:
        description: Event name that triggered this dispatch
        required: false
        default: push
        type: string
      event_number:
        description: Event number that triggered this dispatch
        required: false
        default: 0
        type: string
      event_label:
        description: Event label that triggered this dispatch
        required: true
        default: all-tests
        type: choice
        options:
          - all-tests
          - compile-tests


# https://docs.github.com/en/actions/sharing-automations/reusing-workflows#supported-keywords-for-jobs-that-call-a-reusable-workflow
# Also https://stackoverflow.com/a/74959635
# TL;DR - For public repositories the safest approach will be to use the default read permissions, but at the cost
# of not being able to modify the labels. That will need to be a separate [trusted] workflow that runs from the base repo
# permissions :
#   contents : read
#   pull-requests : write
  
# Write our tests out this way for easier legibility
# testsSet    :
#   - key : value
#     key : value
#     tests :
#       - value
#       - value
#   - < next test >
# https://stackoverflow.com/a/68940067
jobs:
  cmake-tests:
    if : ${{ contains( fromJson('["cmake-tests","all-tests"]'), github.event.label.name ) || github.event_name == 'push' }}
    # I am leaving this here for posterity if this is to be replicated in private repositories for testing
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses : ./.github/workflows/labeled_test.yml
    name : CMake Compilation Tests
    with :
      label    : cmake-tests
      name     : "CMake Compilation Tests"
      host     : derecho
      paths : |
        [ ".sane/" ]
      args : -vr='{"cpus":128,"timelimit":"00:30:00"}'
      patch: |
        {
          "priority" : -99,
          "hosts" :
          {
            "[.*derecho.*]" :
            {
              "account" : "NMMM0012",
              "queue"   : "main",
              "job_suffix" : "cmake-tests.${{ github.event_name == 'push' && github.ref_name || github.event.number }}"
            }
          }
        }
      filter : |
        [ "build_cmake_arw_em_real_.*_dm",
          "build_cmake_arw_em_b_wave_.*_dm"
          ]

      # required to do event trigger
      event_name   : ${{ github.event_name }}
      event_number : ${{ github.event.number }}
      event_label  : ${{ github.event.label.name }}
      ref          : ${{ github.ref }}
      sha          : ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}

  make-tests:
    if : ${{ contains( fromJson('["make-tests","all-tests"]'), github.event.label.name ) || github.event_name == 'push' }}
    # I am leaving this here for posterity if this is to be replicated in private repositories for testing
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses : ./.github/workflows/labeled_test.yml
    name : Make Compilation Tests
    with :
      label    : make-tests
      name     : "Make Compilation Tests"
      host     : derecho
      paths : |
        [ ".sane/" ]
      args : -vr='{"cpus":128,"timelimit":"00:30:00"}'
      patch: |
        {
          "priority" : -99,
          "hosts" :
          {
            "[.*derecho.*]" :
            {
              "account" : "NMMM0012",
              "queue"   : "main",
              "job_suffix" : "make-tests.${{ github.event_name == 'push' && github.ref_name || github.event.number }}"
            }
          }
        }
      actions : |
        [ "build_make_em_real_.*_dmpar",
          "build_make_em_b_wave_.*_serial"
          ]

      # required to do event trigger
      event_name   : ${{ github.event_name }}
      event_number : ${{ github.event.number }}
      event_label  : ${{ github.event.label.name }}
      ref          : ${{ github.ref }}
      sha          : ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}

  # In the event that 'all-tests' is used, this final job will be the one to remove
  # the label from the PR
  removeAllLabel :
    if : ${{ !cancelled() && github.event.label.name == 'all-tests' }}
    name : Remove 'all-tests' label
    runs-on: ubuntu-latest
    needs : [ cmake-tests, make-tests ] # Put tests here to make this wait for the tests to complete
    permissions:
      pull-requests: write
    steps: 
      - name : Remove '${{ github.event.label.name }}' label
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          curl \
            -X DELETE \
            -H "Accept: application/vnd.github.v3+json" \
            -H 'Authorization: token ${{ github.token }}' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${{ github.event.label.name }}
